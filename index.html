<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f6f3">
<title>CE Code</title>
<meta name="ce-book" content="carried">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=7e5a823c">
<script>
// Set before the page paints, so night mode never flashes white.
(function () {
  var chosen = null;
  try { chosen = localStorage.getItem('ce-night'); } catch (e) { /* Nothing was remembered. */ }
  if (chosen ? chosen === 'on' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-night', '');
})();
</script>
</head>
<body>
<div id="app" class="rs-app">
  <main class="rs-scroll gut" id="home">
    <div class="rs-homehead"><h1>Find it in the Code</h1><div class="rs-homeicons"><button class="rs-iconbtn" id="night" type="button"></button><button class="rs-iconbtn" id="fullscreen" type="button" hidden></button></div></div>
    <form class="rs-lock" id="lock" hidden>
      <label class="f">Password<input class="field" id="password" type="password" autocomplete="current-password"></label>
      <button class="btn" id="unlock">Unlock</button>
    </form>
    <button class="link" id="forgot" type="button" hidden>Forgot your password?</button>
    <div class="rs-lock" id="forgotAsk" hidden>
      <p class="rs-grey">This removes the locked book from this device. You will need your PDF again to set a new password.</p>
      <div class="two"><button class="btn soft" id="keepBook" type="button">Keep it</button><button class="btn" id="removeBook" type="button">Remove it</button></div>
    </div>
    <form class="rs-ask" id="form" autocomplete="off" hidden>
      <div class="card"><textarea id="q" placeholder="Paste a question, or type 2-328, 32 or Table 65" aria-label="Question, rule, section or table" disabled></textarea></div>
      <button class="btn" id="go" disabled>Break it down</button>
    </form>
    <p class="rs-grey" id="say" role="status" aria-live="polite"></p>
    <div class="rs-reading" id="reading" hidden><div class="rs-readcard">
      <div class="rs-ring" role="progressbar" aria-label="Reading your book" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><b class="rs-ringpct">0%</b></div>
      <div class="rs-ringtitle">Reading your book</div>
      <div class="rs-ringcount"></div>
      <div class="rs-grey rs-once">Only the first time on this phone.</div>
    </div></div>
    <label class="btn soft" id="pick" hidden>Choose your Code PDF<input type="file" id="file" accept="application/pdf,.pdf" hidden></label>
    <button class="btn soft" id="retry" type="button" hidden>Try again</button>
    <div class="rs-push"></div>
    <button class="link" id="lockNow" type="button" hidden>Lock my book now</button>
    <div id="space" hidden>
      <div class="sp-band" aria-hidden="true"></div>
      <div class="sp-over sp-top" id="spTop"><b class="sp-name">Find</b></div>
      <div class="sp-over sp-zoom"><button class="sp-round" id="undo" type="button" aria-label="Undo" hidden></button><button class="sp-round" id="zfit" type="button" aria-label="Fit all"></button></div>
    </div>
    <p class="note">Build 7e5a823c</p>
  </main>
  <section class="rs-scroll gut rs-tabpage" id="practice" hidden></section>
  <section class="rs-scroll gut rs-tabpage" id="quizzes" hidden></section>
  <section class="rs-view" id="result" hidden></section>
  <nav class="rs-tabbar" id="tabbar" role="tablist" aria-label="Sections" hidden></nav>
</div>
<script type="module" src="rules-ui.js?v=7e5a823c"></script>
</body>
</html>
